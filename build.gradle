plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'net.timelegend.chaka.viewer'
    compileSdk 35

    defaultConfig {
        applicationId 'net.timelegend.chaka.pdf'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // phones only; drop x86 to keep the APK small
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // prebuilt MuPDF (Maven Central)
    implementation 'net.timelegend.mupdf:fitz:1.27.1.13'
}
